# A merge verifies a release candidate; publication is a separate, explicit
# dispatch. npm is the marketplace source, so GitHub Release follows npm proof.
name: Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Full 40-character SHA of the reviewed current main commit
        required: true
        type: string
      publish:
        description: Publish the tested package to npm and create its GitHub Release
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cadence-release
  cancel-in-progress: false

jobs:
  target:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require an immutable target already on main
        id: target
        env:
          RELEASE_TARGET: ${{ inputs.target }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          [[ "$RELEASE_REF" == "refs/heads/main" && "$RELEASE_REPOSITORY" == "cullumco/cadence" ]] || { echo 'Dispatch Release on cullumco/cadence main'; exit 1; }
          [[ "$RELEASE_TARGET" =~ ^[a-f0-9]{40}$ ]] || { echo 'Use a full commit SHA'; exit 1; }
          [[ "$RELEASE_TARGET" == "$RELEASE_WORKFLOW_SHA" ]] || { echo 'Target must match main at dispatch time'; exit 1; }
          git cat-file -e "$RELEASE_TARGET^{commit}"
          git merge-base --is-ancestor "$RELEASE_TARGET" origin/main
          printf 'sha=%s\n' "$RELEASE_TARGET" >> "$GITHUB_OUTPUT"

  verify:
    needs: target
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ needs.target.outputs.sha }}
      release_artifact: true

  publish:
    if: inputs.publish
    needs: [target, verify]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.target.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the reviewed npm CLI with trusted publishing support
        run: npm install --global npm@11.16.0 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-package
          path: ${{ runner.temp }}/cadence-package
      - name: Publish tested bytes, verify npm, then create the matching GitHub Release
        env:
          RELEASE_TARGET: ${{ needs.target.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-alpha.mjs --publish "$RUNNER_TEMP/cadence-package"

  dry-run:
    if: ${{ !inputs.publish }}
    needs: [target, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Report the verified candidate
        env:
          RELEASE_TARGET: ${{ needs.target.outputs.sha }}
        run: |
          printf 'Verified %s on Linux and macOS. Download release-package for the tarball and integrity receipt. No package, tag, release, or deployment was published.\n' "$RELEASE_TARGET" >> "$GITHUB_STEP_SUMMARY"

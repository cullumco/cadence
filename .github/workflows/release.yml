# Turns an ANNOTATED tag (vX.Y.Z) into a GitHub Release whose body is the
# tag's annotation message — the notes live in git, the Release mirrors them.
#
# Two triggers:
#   - tag push: works for tags whose commit contains this file (GitHub runs
#     the workflow version AT the tagged commit, so tags on older commits
#     won't fire it)
#   - workflow_dispatch with a `tag` input: the reliable path, used by the
#     release skill and for backfilling tags that predate this file
#
# Idempotent: if the Release already exists, the job exits cleanly — so
# double-triggering (tag push + dispatch) is harmless.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing annotated tag to publish a GitHub Release for (e.g. v0.1.5)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  github-release:
    name: Create GitHub Release from tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release from annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists — nothing to do"
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --verify-tag \
            --notes-from-tag

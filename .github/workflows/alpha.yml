# Currently disabled server-side via `gh workflow disable Alpha` — the file
# stays so the gate is one command away (`gh workflow enable Alpha`). Run the
# same checks locally with `npm run verify:alpha` in the meantime.

name: Alpha

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify alpha package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Verify alpha
        run: npm run verify:alpha

name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Exact release commit; empty uses the normal push/PR checkout
        type: string
        default: ''
      release_artifact:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify alpha package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up Node for the validator installer
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the reviewed Claude Code validator in an isolated prefix
        # Its postinstall places the platform binary; --ignore-scripts leaves
        # a non-working stub. Installation requires Node 22+, unlike Cadence.
        run: |
          npm install --global --prefix "$RUNNER_TEMP/cadence-validator" @anthropic-ai/claude-code@2.1.304 --no-audit --no-fund
          "$RUNNER_TEMP/cadence-validator/bin/claude" --version
          printf '%s\n' "$RUNNER_TEMP/cadence-validator/bin" >> "$GITHUB_PATH"
      - name: Set up Node at Cadence's supported engines floor
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify and retain the installed tarball
        run: npm run verify:alpha -- --pack-dir "$RUNNER_TEMP/cadence-package"
      - name: Save the tested Linux package for release
        if: inputs.release_artifact && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-package
          path: |
            ${{ runner.temp }}/cadence-package/*.tgz
            ${{ runner.temp }}/cadence-package/release.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

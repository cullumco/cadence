# The release gate, run on every push/PR to main. (Renamed from alpha.yml:
# the old path had been disabled server-side, and GitHub keys disablement by
# file path — a new path registers a fresh, enabled workflow.)
# The same checks run locally via `npm run verify:alpha`.

name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify alpha package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Both legs must report: a Linux degradation failure and a macOS
      # rich-signal failure are independent findings.
      fail-fast: false
      matrix:
        # Two legs, two contracts:
        #   ubuntu-latest — "non-macOS degrades silently, never breaks the
        #     hook": darwin-gated tests skip, everything else must pass with
        #     the Mac probes absent.
        #   macos-latest  — the rich-signal path: the darwin-only tests
        #     (AppleScript compile, Focus probe) actually execute.
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # 20 = the engines floor in package.json, tested on purpose (the
          # action itself runs on the runner's Node 24; this only picks the
          # version our steps run on)
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Verify alpha
        run: npm run verify:alpha

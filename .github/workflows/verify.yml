# The release gate, run on every push/PR to main. (Renamed from alpha.yml:
# the old path had been disabled server-side, and GitHub keys disablement by
# file path — a new path registers a fresh, enabled workflow.)
# The same checks run locally via `npm run verify:alpha`.

name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify alpha package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Verify alpha
        run: npm run verify:alpha
